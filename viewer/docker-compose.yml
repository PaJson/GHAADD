# GHAADD web viewer (the daemon stays on its own computer and pushes to this).
#
#   1. python main.py --new-viewer-token          (on the daemon's computer; prints a token; make one per daemon)
#   2. in this folder:  cp config/.env.example config/.env   and put the tokens in config/.env
#   3. in this folder:  docker compose up -d --build
#   4. in each daemon's config.json (or GUI: Settings -> Viewer):
#        "viewer": {"enabled": true, "url": "http://<this-host>:8888", "token": "<its token>", "name": "<its name>"}
#
# To add or remove a daemon later just edit config/.env: the viewer re-reads it, no restart needed.
# The whole config FOLDER is mounted (not the single file): an editor that saves by replacing the file would
# otherwise leave the container looking at the old one. Copy this whole folder (viewer/) to the server.
services:
  ghaadd-viewer:
    # Always start it with "docker compose up -d --build": that builds the image first. A plain "up -d" with an
    # image name that is not on this computer yet tries to pull it from Docker Hub first and prints a harmless
    # "pull access denied" before it builds. --build is also how a new ghaadd_viewer.py gets into the image.
    build: .
    image: ghaadd-viewer:latest
    container_name: ghaadd-viewer
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      GHAADD_VIEWER_PORT: "8888"
      # Seconds without data before the page says "no data received" (about three missed heartbeats).
      GHAADD_VIEWER_LOST_AFTER: "45"
      # Days after which a lost or stopped daemon is dropped from the list (0 = never).
      GHAADD_VIEWER_FORGET_AFTER_DAYS: "7"
    volumes:
      - ./config:/app/config:ro  # the one place the viewer reads its tokens from: config/.env
      - ./assets:/app/assets:ro  # the page's icon (a copy of the GUI's); the page works without it
    # The viewer keeps everything in memory and writes nothing.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
